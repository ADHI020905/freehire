d Experience\r\n\u003cp\u003e- Tốt nghiệp Đại học các chuyên ngành: Công nghệ thông tin, Khoa học máy tính,Công nghệ phần mềm, Hệ thống thông tin, Tự động hóa, Điện tử viễn thông hoặc các ngành liên quan\u003c/p\u003e\u003cp\u003e- Có kinh nghiệm thực tế làm Backend tại công ty hoặc dự án lớn.\u003c/p\u003e\u003cp\u003e- Thành thạo ít nhất 1 ngôn ngữ Backend: Ưu tiên Python, Go, C/C++\u003c/p\u003e\u003cp\u003e- Có kinh nghiệm thiết kế hệ thống Microservice Architecture.\u003c/p\u003e\u003cp\u003e- Thành thạo một trong các hệ quản trị cơ sở dữ liệu:PostgreSQL, MongoDB...\u003c/p\u003e\u003cp\u003e- Hiểu rõ API design (RESTful/gRPC), bảo mật và tối ưu hiệu năng hệ thống.\u003c/p\u003e\u003cp\u003e- Có kinh nghiệm với: LLM Agents (GPT, Gemini, Claude...), LangChain / LangGraph/ ADK, Autogen, RAG pipelines, Vector Database(Milvus, pgvector...). Tool-use Agents (Function Calling), Memory + Planning + Multi-step reasoning systems\u003c/p\u003e\u003cp\u003e- Thành thạo Git/GitFlow\u003c/p\u003e\u003cp\u003e- Có kinh nghiệm: Docker, Kubernetes...\u003cbr\u003e\u003cstrong\u003eƯu tiên:\u003c/strong\u003e\u003cbr\u003e+ Có kinh nghiệm trong domain: Tài chính, ngân hàng, chứng khoán\u003cbr\u003e+ Hiểu biết về AI Safety, Guardrails, Model Monitoring.\u003cbr\u003e+ Có kinh nghiệm tối ưu hệ thống AI cost-efficient ở production.\u003cbr\u003e+ Với ứng viên Junior, Fresher: Ưu tiên các bạn xếp loại học tập loại Giỏi, Xuất sắc; GPA cao; đạt giải thưởng trong các cuộc thi chuyên môn, học sinh giỏi tỉnh, thành phố trở lên; có nghiên cứu khoa học được công bố tại các hội thảo, tạp chí quốc tế (ứng viên cần thể hiện nội dung về GPA, giải thưởng trong CV)\u003cbr\u003e+ Có kiến thức, Kỹ thuật xử lý dữ liệu:NLP, Computer Vision, Speech, Video Understanding\u003cbr\u003e+ Hiểu biết kiến trúc mô hình: CNN, RNN, Transformer, Attention, GNN…\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMB Bank yêu cầu ứng viên ứng tuyển cần cung cấp chi tiết các thông tin sau:\u003c/strong\u003e\u003cbr\u0
