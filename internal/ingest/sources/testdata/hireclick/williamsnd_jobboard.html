                    type: 'GET',
                    url: '/api/Controllers/JobBoard/GetSettingsAndJobs',
                    data: requestData,
                    dataType: 'json',
                    success: function (result) {
                        if (result !== null) {
                            let jobBoardData = JSON.parse(result);
                            _jobList = jobBoardData.JobList;
                            _jobBoardSettings = jobBoardData.Settings;
                            jobBoardSetup()
                        } else {
                            console.log('Could not retrieve jobs');
                        }
                    },
                    error: function (xhr, status, error) {
                        console.log('Error - ' + xhr.status + ': ' + xhr.statusText);
                    }
                });
            }
        });

        function isPreviewSite() {
            let urlParams = new URLSearchParams(window.location.search);

            for (const [key, value] of urlParams) {
                if (key.toLowerCase() === 'previewid') {
                    return Boolean(value);
                }
            }
            return false;
        }

        function jobBoardSetup() {
            _printJobList = _jobList;
            if (_jobBoardSettings.EnableGenericJob && _jobBoardSettings.ActivateGenericJob) {
                _showGenericJob = true;
            }

            if (_jobList.length > 0) {
                $('#divNoListings').hide();
                if ($('#hdnLayoutType').val() === 'grid') {
                    // Setup DDLs quick a minute
                    $.ajax({
                        type: 'GET',
                        url: '/api/Controllers/JobBoard/GetDropdownMenuData',
                        data: 'orgGUID=' + _orgGuid,
                        dataType: 'json',
                        success: function (result) {
                            if (result !== null) {
                                let dropdownData = JSON.parse(result);
                                createDropdowns(dropdownData);
                            } else {
                                console.log('Could not retrieve dropdown data');
                            }
                        },
                        error: function (xhr, status, error) {
                            console.log('Error - ' + xhr.status + ': ' + xhr.statusText);
                        }
                    });
                } else {
                    $('.gridView').hide();
                    $('.listView').show();
                    printJobsList(0);
                }
            } else if (_showGenericJob === true) {
                if ($('#hdnLayoutType').val() === 'grid') {
                    $('.listView').hide();
                    $('.gridView').show();
                    printJobsGrid(0);
                } else {
                    $('.gridView').hide();
                    $('.listView').show();
                    printJobsList(0);
                }
            } else {
                $('.listView').hide();
                $('.gridView').hide();
                $('#divNoListings').show();
            }
        }

        function createDropdowns(dropdownData) {
            if (sessionStorage.jobBoardLocationID) {
                _locationID = sessionStorage.jobBoardLocationID;
            }
            if (sessionStorage.jobBoardCategoryID) {
                _categoryID = sessionStorage.jobBoardCategoryID;
            }

            $.each(dropdownData.JobLocations, function () {
                $('#ddlLocations').append('<option value="' + this.Value + '">' + this.Name + '</option>');
            });

            $.each(dropdownData.JobCategories, function () {
                $('#ddlCategories').append('<option value="' + this.Value + '">' + this.Name + '</option>');
            });

            if (_locationID > 0) {
                $('#ddlLocations').val(_locationID);
            }
            if (_categoryID > 0) {
                $('#ddlCategories').val(_categoryID);
            }

            $('#ddlLocations').on('change', function () {
                _locationID = $(this).val();
                sessionStorage.setItem('jobBoardLocationID', _locationID);
                filterJobList();
            });

            $('#ddlCategories').on('change', function () {
                _categoryID = $(this).val();
                sessionStorage.setItem('jobBoardCategoryID', _categoryID);
                filterJobList();
            });

            $('.listView').hide();
            $('.gridView').show();
            filterJobList();
        }

        function filterJobList() {
            if (_locationID > 0 && _categoryID > 0) {
                _printJobList = $.grep(_jobList, function (element) { return element.LocationID == _locationID && element.CategoryID == _categoryID; });
            } else if (_locationID > 0) {
                _printJobList = $.grep(_jobList, function (element) { return element.LocationID == _locationID; });
            } else if (_categoryID > 0) {
                _printJobList = $.grep(_jobList, function (element) { return element.CategoryID == _categoryID; });
            } else {
                _printJobList = _jobList;
            }

            printJobsGrid(0);
        }

        function printJobsList(pageNumber) {
            // Page Info
            pageNumber = Number(pageNumber);
	        let start = pageNumber * _jobPageSize;
	        pageNumber = pageNumber + 1;
	        let end = pageNumber * _jobPageSize;
	        if (end > _printJobList.length) {
		        end = _printJobList.length;
	        }
            let pageCount = Math.ceil(_printJobList.length / _jobPageSize);

            // Jobs
            $('#jobBoardJobList').html('');
            let template = '';
            for (i = start; i < end; i++) {
                let oddEvenClass = 'openings-list__item--odd';
                if (i % 2 === 0) {
                    oddEvenClass = 'openings-list__item--even';
                }
                template = '<li class="openings-list__item ' + oddEvenClass + '">';

                if (isPreviewSite()) {
                    // Just removing the new tab behavior since preview is served in iframe
                    template += '<div class="openings-list__title"><h3><a href="' + _printJobList[i].JobURL + '#title">' + _printJobList[i].JobTitle + '</a></h3></div>';
                }
                else {
                    template += '<div class="openings-list__title"><h3><a href="' + _printJobList[i].JobURL + '#title" target="_blank">' + _printJobList[i].JobTitle + '</a></h3></div>';
                }

                template += '<div class="openings-list__summary">' + _printJobList[i].JobDescriptionShort + ' - <a href="' + _printJobList[i].JobURL + '">View More</a></div>';
                template += '</li>';

                $('#jobBoardJobList').append(template);
            }

            // Add General Application (if applicable)
            if (_showGenericJob === true) {
                template = '<li class="borderedBox row small" style="margin-top: 50px;">';
                template += '<div class="col-12"><h4><a href="/jb/generalApplication" class="generic-job-title">' + _jobBoardSettings.GenericJobTitle + '</a></h4></div>';
                template += '<div class="openings-list__summary col-10">' + _jobBoardSettings.GenericJobDescription + ' <a href="/jb/generalApplication">View More</a></div>';
                template += '<div class="openings-list__summary col-2"><i class="fa fa-file-text fa-3x" style="color:#727171;"></i></div>';
                template += '<div class="col-12">&nbsp;</div>';
                template += '</li>';

                $('#jobBoardJobList').append(template);
            }

            // Paging
            $('#jobBoardJobListPaging').html('');
            if (pageCount > 1) {
                let minPage = 1;
                if (pageNumber > 4) {
	                minPage = pageNumber - 2;
                }
                let maxPage = pageCount;
                if (pageCount > pageNumber + 2) {
	                maxPage = pageNumber + 2;
                }
    
                if (minPage > 1) {
	                template = '<button type="button" data-id="0" class="jobBoardJobPageButton">1</button>...';
	                $('#jobBoardJobListPaging').append(template);
                }
                for (i = minPage; i <= maxPage; i++) {
	                if (i === pageNumber) {
		                template = '<button disabled type="button" data-id="' + (i - 1) + '" class="jobBoardJobPageButton">' + i + '</button>';
	                } else {
		                template = '<button type="button" data-id="' + (i - 1) + '" class="jobBoardJobPageButton">' + i + '</button>';
	                }
	                $('#jobBoardJobListPaging').append(template);
                }
                if (maxPage < pageCount) {
	                template = '...<button type="button" data-id="' + (pageCount - 1) + '" class="jobBoardJobPageButton">' + pageCount + '</button>';
	                $('#jobBoardJobListPaging').append(template);
                }

                $('.jobBoardJobPageButton').on('click', function () {
	                printJobsList($(this).attr('data-id'));
                });
            }
        }

        function printJobsGrid(pageNumber) {
            // Page Info
            pageNumber = Number(pageNumber);
	        let start = pageNumber * _jobPageSize;
	        pageNumber = pageNumber + 1;
	        let end = pageNumber * _jobPageSize;
	        if (end > _printJobList.length) {
		        end = _printJobList.length;
	        }
            let pageCount = Math.ceil(_printJobList.length / _jobPageSize);

            // Jobs
            $('#jobBoardJobGrid').html('');
            let template = '';
            for (i = start; i < end; i++) {
                template = '<tr class="openings-table__row openings-table__row--even">';
                template += '<td class="openings-table__data openings-table__data--title" style="font-size:20px;">';
                template += '<a href="' + _printJobList[i].JobURL + '#title">' + _printJobList[i].JobTitle + '</a>';
                template += '<div class="clearfix"></div><div class="subinfo"><i class="fa fa-map-marker"></i> ' + _printJobList[i].JobCity;
                template += '    <i class="fa fa-sitemap"></i> ' + _printJobList[i].JobType + '</div>';
                template += '</td></tr>';

                $('#jobBoardJobGrid').append(template);
            }

            // Add General Application (if applicable)
            if (_showGenericJob === true) {
                template = '<tr><td style="padding-top: 50px;">';
                template += '<div class="row borderedBox" style="padding:4px 0px 4px 0px;">';
                template += '<div class="col-10"><a class="generic-job-title" href="/jb/generalApplication">' + _jobBoardSettings.GenericJobTitle + '</a></div>';
                template += '<div><i class="fa fa-file-text fa-3x col-2" style="color:#727171;"></i></div>';
                template += '</div></td></tr>';

                $('#jobBoardJobGrid').append(template);
            }

            // Paging
            $('#jobBoardJobListPaging').html('');
            if (pageCount > 1) {
                let minPage = 1;
                if (pageNumber > 4) {
	                minPage = pageNumber - 2;
                }
                let maxPage = pageCount;
                if (pageCount > pageNumber + 2) {
	                maxPage = pageNumber + 2;
                }
    
                if (minPage > 1) {
	                template = '<button type="button" data-id="0" class="jobBoardJobPageButton">1</button>...';
	                $('#jobBoardJobListPaging').append(template);
                }
                for (i = minPage; i <= maxPage; i++) {
	                if (i === pageNumber) {
		                template = '<button disabled type="button" data-id="' + (i - 1) + '" class="jobBoardJobPageButton">' + i + '</button>';
	                } else {
		                template = '<button type="button" data-id="' + (i - 1) + '" class="jobBoardJobPageButton">' + i + '</button>';
	                }
	                $('#jobBoardJobListPaging').append(template);
                }
                if (maxPage < pageCount) {
	                template = '...<button type="button" data-id="' + (pageCount - 1) + '" class="jobBoardJobPageButton">' + pageCount + '</button>';
	                $('#jobBoardJobListPaging').append(template);
                }

                $('.jobBoardJobPageButton').on('click', function () {
	                printJobsGrid($(this).attr('data-id'));
                });
            }
        }

    </script>

</body>
</html>
