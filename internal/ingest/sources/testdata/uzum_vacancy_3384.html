<!DOCTYPE html><html><head><title>Senior System Analyst \ Cистемный Аналитик | Uzum People</title></head><body><script>self.__next_f.push([1,"\n1c:Tc3d,{\"components\":[{\"id\":1781251372292,\"type\":\"text\",\"displayType\":\"text\",\"value\":{\"body\":\"\u003ch4>Чем предстоит заниматься: \u003c/h4>\u003cul>\u003cli>Погружаться в детали реализации существующих систем и предлагать варианты их улучшения;\u003c/li>\u003cli>Принимать участие в проработке технических решений для новых и существующих цифровых систем;\u003c/li>\u003cli>Выявлять/собирать функциональные и нефункциональные требования к системе на различных уровнях: web, back-end;\u003c/li>\u003cli>Создавать спецификации, схемы взаимодействия, потоков и моделей данных, а также описывать контракты;\u003c/li>\u003cli>Разбираться в деталях интеграции: по предоставленной документации или ее фактической реализации.\u003c/li>\u003c/ul>\u003ch4>Что для нас важно: \u003c/h4>\u003cul>\u003cli>Опыт в различных проектах в роли системного аналитика от 3-х лет;\u003c/li>\u003cli>Опыт проектирования интеграций с синхронным и асинхронным взаимодействием;\u003c/li>\u003cli>Практический опыт проектирования контрактов с различными архитектурами API;\u003c/li>\u003cli>Понимание основ работы реляционных БД;\u003c/li>\u003cli>Опыт или понимание базовых паттернов сервисной архитектуры, таких как api-gateway, BFF и т.д.\u003c/li>\u003c/ul>\u003ch4>Мы предлагаем: \u003c/h4>\u003cul>\u003cli>Сильную техническую команду, которая всегда готова делиться опытом;\u003c/li>\u003cli>Крутую продуктовую культуру. \u003c/li>\u003cli>Опираемся на исследования и метрики, фокусируемся на результате;\u003c/li>\u003cli>Свободу действий и возможность напрямую влиять на развитие бизнеса;\u003c/li>\u003cli>Комфортный современный офис в центре Ташкента;\u003c/li>\u003cli>Официальное оформление по ТК УЗ, три дополнительных оплачиваемых дня к отпуску;\u003c/li>\u003cli>Мы - резидент IT-парка, наши специалисты могут получить IT-визу, которая приравнивается к ВНЖ;\u003c/li>\u003cli>Развитие личного бренда на конференциях, митапах и внутренних событиях.\u003c/li>\u003cli>База — комьюнити профессионалов с желанием делать круто. Приятный бонус — ДМС в привязке к вашей локации, обучение и другие плюшки\u003c/li>\u003c/ul>\"}}]}"])</script><script>self.__next_f.push([1,"\n1d:Tdb7,{\"components\":[{\"id\":1782076827887,\"type\":\"text\",\"displayType\":\"text\",\"value\":{\"body\":\"\u003cp>\u003cbr>\u003c/p>\u003ch4 dir=\\\"ltr\\\">Nimalar bilan shug‘ullanasiz:\u003c/h4>\u003cul>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Mavjud tizimlarning ishlash tamoyillarini chuqur o‘rganish va ularni takomillashtirish bo‘yicha takliflar berish;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Yangi va amaldagi raqamli tizimlar uchun texnik yechimlarni ishlab chiqishda ishtirok etish;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Tizim uchun funksional va nofunksional talablarni turli darajalarda (web va back-end) aniqlash va yig‘ish;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Spetsifikatsiyalar, o‘zaro ishlash sxemalari, ma’lumotlar oqimi va ma’lumotlar modellari yaratish, shuningdek kontraktlarni tavsiflash;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Integratsiyalar tafsilotlarini taqdim etilgan hujjatlar yoki amaldagi realizatsiya asosida tahlil qilish.\u003c/p>\u003c/li>\u003c/ul>\u003ch4 dir=\\\"ltr\\\">Biz uchun muhim:\u003c/h4>\u003cul>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Kamida 3 yillik tizim tahlilchisi sifatidagi ish tajribasi;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Sinxron va asinxron integratsiyalarni loyihalash tajribasi;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Turli API arxitekturalari uchun kontraktlarni loyihalash bo‘yicha amaliy tajriba;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Relyatsion ma’lumotlar bazalari ishlash tamoyillarini tushunish;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">API Gateway, BFF va boshqa servis arxitekturasi patternlari bo‘yicha tajriba yoki tushuncha.\u003c/p>\u003c/li>\u003c/ul>\u003ch4 dir=\\\"ltr\\\">Biz nima taklif qilamiz:\u003c/h4>\u003cul>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Tajribasi bilan bo‘lishishga tayyor kuchli texnik jamoa;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Kuchli mahsulot madaniyati;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Qarorlarni tadqiqotlar va metrikalar asosida qabul qiladigan muhit;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Biznes rivojiga bevosita ta’sir qilish imkoniyati va qaror qabul qilish erkinligi;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Toshkent markazidagi zamonaviy va qulay ofis;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">O‘zbekiston Respublikasi Mehnat kodeksi bo‘yicha rasmiylashtirish, ta’tilga qo‘shimcha uch kunlik haq to‘lanadigan ta’til;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Biz IT-Park rezidentimiz, mutaxassislarimiz yashash uchun ruxsatnomaga tenglashtirilgan IT-viza olishlari mumkin;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Konferensiyalar, metaplar va ichki tadbirlar orqali shaxsiy brendni rivojlantirish imkoniyati.\u003c/p>\u003c/li>\u003c/ul>\u003cul>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Asos — ishni yuqori darajada bajarishga intiladigan professionallar hamjamiyati. Yoqimli bonus — lokatsiyangizga bog‘langan ITS, o‘qish va boshqa qo‘shimcha imkoniyatlar.\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\"}}]}"])</script><script>self.__next_f.push([1,"5:[\"$\",\"main\",null,{\"children\":[[\"$\",\"script\",null,{\"id\":\"schema-vacancy-breadcrumb-3384\",\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"Главная\\\",\\\"item\\\":\\\"https://people.uzum.com/career/ru\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"Вакансии\\\",\\\"item\\\":\\\"https://people.uzum.com/career/ru/vacancies\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":3,\\\"name\\\":\\\"Senior System Analyst \\\\\\\\ Cистемный Аналитик\\\",\\\"item\\\":\\\"https://people.uzum.com/career/ru/vacancies/3384\\\"}]}\"}}],null,[\"$\",\"$L1b\",null,{\"locale\":\"ru\",\"vacancy\":{\"id\":3384,\"linked_id\":3383,\"type\":\"Original\",\"status\":\"Published\",\"title_ru\":\"Senior System Analyst \\\\ Cистемный Аналитик\",\"title_en\":\"Senior System Analyst / Tizim tahlilchisi\",\"body_ru\":\"$1c\",\"body_en\":\"$1d\",\"disabled\":false,\"tags\":[\"Fintech\"],\"huntflow_id\":8832,\"sort_order\":0,\"publication_date\":\"06/12/2026\",\"application_count\":26,\"company_ids\":[2],\"description_required\":false,\"huntflow_status\":\"\",\"business_unit\":{\"unit_key\":\"bank\",\"labels\":{\"ru\":\"Uzum B
