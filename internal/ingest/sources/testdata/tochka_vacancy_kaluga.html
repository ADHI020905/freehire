 dir=\"ltr\">Компенсация за разъездной характер работы и компенсация питания.\u003c/li>\n\t\u003cli dir=\"ltr\">Зарплата полностью официальная. Оплачиваемые отпуска и больничные без долгих согласований.\u003c/li>\n\t\u003cli dir=\"ltr\">Нет привязки к офису. Часть рабочего дня проходит на встречах с клиентами, а остальное время можешь работать удалённо или из офиса — как тебе удобнее.\u003c/li>\n\u003c/ul>\n\n\u003cp dir=\"ltr\">2. Комфортный формат работы\u003c/p>\n\n\u003cul>\n\t\u003cli dir=\"ltr\">Техника для работы за наш счёт. Всё необходимое для успешных продаж: корпоративная сотовая связь и быстрый ноутбук.\u003c/li>\n\t\u003cli dir=\"ltr\">Свобода от скриптов. Общаемся с предпринимателями на равных, как с друзьями.\u003c/li>\n\t\u003cli dir=\"ltr\">Дресс-кода нет, но на встречах с клиентами важно выглядеть аккуратно и опрятно.\u003c/li>\n\u003c/ul>\n\n\u003cp dir=\"ltr\">3. Развитие и поддержка\u003c/p>\n\n\u003cul>\n\t\u003cli dir=\"ltr\">ДМС со стоматологией, полис путешественника и спортзалы в четырёх офисах. Есть 4 дополнительных выходных в год и скидки 80% на психолога.\u003c/li>\n\t\u003cli dir=\"ltr\">500+ бесплатных курсов: ты всегда будешь знать, что делать, чтобы получать новые роли в команде и расти в зарплате.\u003c/li>\n\t\u003cli dir=\"ltr\">Бонусы от Точка Банка и партнёров. Пользуйся скидками от Skillbox, Skyeng, Яндекс Практикум и других.\u003c/li>\n\t\u003cli dir=\"ltr\">Не только работа: устраиваем кинопоказы, спортивные марафоны и корпоративы, которые потом ещё долго вспоминают.\u003c/li>\n\u003c/ul>\n\n\u003cp dir=\"ltr\">Если хочешь развиваться в активных продажах офлайн, готов много общаться с клиентами и работать с отказами — откликайся!\u003c/p>6:[\"$\",\"$L1b\",null,{\"children\":[[[\"$\",\"$L1c\",null,{\"position\":\"absolute\",\"color\":\"black\"}],[\"$\",\"$L1d\",null,{\"position\":\"absolute\",\"color\":\"black\"}]],[\"$\",\"div\",null,{\"className\":\"vacancy-page_container__Fumwz\",\"children\":[[\"$\",\"div\",null,{\"className\":\"vacancy-page_breadcrumbsWrapper__UbYsG\",\"children\":[\"$\",\"nav\",null,{\"aria-label\":\"Breadcrumb\",\"className\":\"breadcrumbs_themeDark__HiPou breadcrumbs_listContainer__hWVNT\",\"children\":[\"$\",\"ol\",null,{\"itemScope\":true,\"itemType\":\"https://schema.org/BreadcrumbList\",\"className\":\"breadcrumbs_list__ncWg4\",\"children\":[[\"$\",\"li\",\"/\",{\"itemProp\":\"itemListElement\",\"itemScope\":true,\"itemType\":\"https://schema.org/ListItem\",\"className\":\"breadcrumbs_item__cMJ9H\",\"children\":[[\"$\",\"$L1e\",null,{\"href\":\"/\",\"itemProp\":\"item\",\"className\":\"breadcrumbs_link__oeXTz\",\"children\":[[\"$\",\"span\",null,{\"itemProp\":\"name\",\"children\":\"Главная страница\"}],[\"$\",\"svg\",null,{\"xmlns\":\"http://www.w3.org/2000/svg\",\"width\":20,\"height\":20,\"fill\":\"none\",\"children\":[\"$\",\"path\",null,{\"fill\":\"currentColor\",\"fillOpacity\":0.4,\"fillRule\":\"evenodd\",\"d\":\"M7.293 5.293a1 1 0 0 1 1.414 0L13.414 10l-4.707 4.707a1 1 0 0 1-1.414-1.414L10.586 10 7.293 6.707a1 1 0 0 1 0-1.414\",\"clipRule\":\"evenodd\"}]}]]}],[\"$\",\"meta\",null,{\"itemProp\":\"position\",\"content\":\"1\"}]]}],[\"$\",\"li\",\"/vacancies/\",{\"itemProp\":\"itemListElement\",\"itemScope\":true,\"itemType\":\"https://schema.org/ListItem\",\"className\":\"breadcrumbs_item__cMJ9H\",\"children\":[[\"$\",\"$L1e\",null,{\"href\":\"/vacancies/\",\"itemProp\":\"item\",\"className\":\"breadcrumbs_link__oeXTz\",\"children\":[[\"$\",\"span\",null,{\"itemProp\":\"name\",\"children\":\"Вакансии\"}],[\"$\",\"svg\",null,{\"xmlns\":\"http://www.w3.org/2000/svg\",\"width\":20,\"height\":20,\"fill\":\"none\",\"children\":\"$6:props:children:1:props:children:0:props:children:props:children:props:children:0:props:children:0:props:children:1:props:children\"}]]}],[\"$\",\"meta\",null,{\"itemProp\":\"position\",\"content\":\"2\"}]]}],[\"$\",\"li\",\"/vacancies/catalog/menedzher-po-prodazham-vyezdnye-vstrechi-kaluga/\",{\"itemProp\":\"itemListElement\",\"itemScope\":true,\"itemType\":\"https://schema.org/ListItem\",\"className\":\"breadcrumbs_item__cMJ9H\",\"children\":[[\"$\",\"span\",null,{\"itemProp\":\"name\",\"className\":\"breadcrumbs_current__XQbnX\",\"children\":\"Менеджер по продажам (выездные встречи)\"}],[\"$\",\"meta\",null,{\"itemProp\":\"position\",\"content\":\"3\"}]]}]]}]}]}],[\"$\",\"div\",null,{\"className\":\"vacancy-page_layout__HmAIK\",\"children\":[[\"$\",\"div\",null,{\"className\":\"$undefined\",\"children\":[[\"$\",\"$L1f\",null,{\"vacancy\":{\"mainCategory\":{\"title\":\"Продажи\",\"slug\":\"sales\",\"surveyLink\":\"https://i.tochka.com/bank/surveys/e2f5771f-49f8-4450-a410-87edc0ce76c0\"},\"additionalCategory\":null,\"mainSpecialization\":{\"title\":\"Активные продажи\",\"slug\":\"aktivnye-prodazhi\"},\"additionalSpecialization\":null,\"title\":\"Менеджер по продажам (выездные встречи)\",\"slug\":\"menedzher-po-prodazham-vyezdnye-vstrechi-kaluga\",\"type\":null,\"needCity\":false,\"needHref\":false,\"salaryFrom\":150000,\"salaryTo\":null,\"formattedSalary\":\"от 150 000 ₽\",\"typeEmployment\":\"full\",\"workFormat\":\"trips\",\"workFormatInRussian\":\"Разъезды\",\"workExperience\":\"up_to_three_years\",\"workExperienceInRussian\":\"От 1 года до 3 лет\",\"city\":{\"name\":\"Калуга\",\"slug\":\"kaluga\"},\"detail\":\"\u003cp dir=\\\"ltr\\\">Ищем специалиста с опытом привлечения клиентов. Предстоит самостоятельно заниматься продажами и основную часть рабочего времени проводить на встречах с предпринимателями и представителями компаний.&nbsp;\u003c/p>\\n\\n\u003cp dir=\\\"ltr\\\">После отклика будь на связи — мы свяжемся с тобой по указанным контактам в резюме и расскажем о следующих шагах.\u003c/p>\\n\\n\u003cp dir=\\\"ltr\\\">Точка Банк — это финтех-компания. Создаём онлайн-банк и экосистему сервисов для бизнеса. Привыкли бросать вызов себе и рынку, строить с нуля, изобретать и менять привычное.\u003c/p>\",\"aboutTeam\":null,\"requirement\":\"\u003cul>\\n\\t\u003cli dir=\\\"ltr\\\">Привлекать новых клиентов офлайн. Это руководители компаний, холдингов и другого бизнеса.\u003c/li>\\n\\t\u003cli dir=\\\"ltr\\\">Развивать партнёрскую сеть города: находить и подключать партнёров, учить их продавать продукты Точка Банка и регулярно встречаться с ними лично.\u003c/li>\\n\\t\u003cli dir=\\\"ltr\\\">Продавать банковские сервисы во время встреч с потенциальными клиентами в бизнес-центрах, на выставках или конференциях. Например, это может быть открытие расчётного счёта или же сервис закупок из-за рубежа для тех, кто продаёт на маркетплейсах.\u003c/li>\\n\\t\u003cli dir=\\\"ltr\\\">Рабочий день будет состоять из встреч с клиентами по готовому маршруту и звонков. Маршрут составляем так, чтобы встречи находились недалеко друг от друга и тебе не приходилось тратить лишнее время на дорогу.\u003c/li>\\n\u003c/ul>\\n\\n\u003cp dir=\\\"ltr\\\">Чем больше клиентов ты привлекаешь, тем больше зарабатываешь: в продажах нет потолка по доходу. Это возможность прокачать навык переговоров, глубже понять, как устроен бизнес клиентов, и вырасти в продажах.\u003c/p>\",\"responsibility\":\"\u003cul>\\n\\t\u003cli dir=\\\"ltr\\\">Справляешься с большим количеством встреч по городу в течение рабочего дня.\u003c/li>\\n\\t\u003cli dir=\\\"ltr\\\">Планируешь развиваться в продажах как минимум ближайший год и понимаешь, как этот навык поможет тебе расти в доходе, уверенности и карьере.\u003c/li>\\n\\t\u003cli dir=\\\"ltr\\\">Есть опыт продаж услуг юридическим лицам — знаешь этапы продаж, умеешь работать с возражениями.\u003c/li>\\n\\t\u003cli dir=\\\"ltr\\\">Умеешь работать с отказами и не теряешься в сложных ситуациях.\u003c/li>\\n\\t\u003cli dir=\\\"ltr\\\">Спокойно относишься к обратной связи и открыт к новым подходам и инструментам.\u003c/li>\\n\\t\u003cli dir=\\\"ltr\\\">Несёшь ответственность за свои действия и результаты.\u003c/li>\\n\u003c/ul>\",\"expectation\":\"$20\",\"stack\":null,\"publishedAt\":\"2026-09-30\",\"blockTitle\":null,\"blocks\":null,\"formattedPublishedAt\":\"30.09
