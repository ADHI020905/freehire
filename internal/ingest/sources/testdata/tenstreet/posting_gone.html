		<script>
		var map_array = [];
		var active_job_array = null;
		map_array.push(['State', 'Number of Jobs']);
		$.each(active_job_array, function(index, job_info)
			   {
					if (job_info.location_type == 'zip_radius')
					{
						//then we need to use the state
						map_array.push(['US-'+job_info.state, 1]);
					}
					else
					{
						if (job_info.location_type == 'select_states')
						{
							map_array.push(['US-'+job_info.value, 1]);
						}
					}
			   });

		google.charts.load('upcoming', {'packages':['geochart']});
		google.charts.setOnLoadCallback(drawRegionsMap);
		//window.setTimeout(function(){drawRegionsMap();}, 500);

		//if (!pulse.maps_loaded)
		//{
		//	google.charts.load('current', {'packages': ['geochart']});
		//	google.charts.setOnLoadCallback(pulse.drawRegionsMap);
		//	pulse.maps_loaded = true;
		//}
		//else
		//{
		//	window.setTimeout(function(){drawRegionsMap();}, 500);
		//
		//}

		function drawRegionsMap()
		{
			$("#active_job_detail_content #geochart_loading_spinner").hide();
			var data = google.visualization.arrayToDataTable(map_array);


			//[
			//  ['State', 'Number of Jobs'],
			//  ['US-IL', 1],
			//  ['US-IN', 1],
			//  ['US-IA', 2],
			//  ['US-RI', 1],
			//  ['US-OK', 1],
			//  ['US-TX', 4],
			//  ['US-KS', 2],
			//  ['US-UT', 4]
			//]

			var options = {
			  region: 'US', // Africa
			  colorAxis: {
				colors: ['#F1C0BF', '#c80501', '#c80501']
			  },
			  //backgroundColor: '#81d4fa',
			  //datalessRegionColor: '#f8bbd0',
			  //defaultColor: '#f5f5f5',
			  resolution: "provinces",
			  legend: 'none'
			};

			var chart = new google.visualization.GeoChart(document.getElementById('geochart-colors'));
			chart.draw(data, options);
		}
		</script>
