3c/li>\n\t\u003cli>Выстраивать продуктовую аналитику для\u003cspan class=\"nbsp\">&nbsp;\u003c/span>новых продуктов.\u003c/li>\n\t\u003cli>Работать с\u003cspan class=\"nbsp\">&nbsp;\u003c/span>внутренними бизнес-заказчиками, чтобы\u003cspan class=\"nbsp\">&nbsp;\u003c/span>формировать требования к&nbsp;метрикам, визуализации данных и\u003cspan class=\"nbsp\">&nbsp;\u003c/span>их развитию.\u003c/li>\n\t\u003cli>Создавать финансовую модель и\u003cspan class=\"nbsp\">&nbsp;\u003c/span>поддерживать её прозрачность.&nbsp;\u003c/li>\n\t\u003cli>Искать, подключать и\u003cspan class=\"nbsp\">&nbsp;\u003c/span>сопровождать новые источники данных так, чтобы\u003cspan class=\"nbsp\">&nbsp;\u003c/span>качество данных соответствовало всем требованиям.\u003c/li>\n\t\u003cli>Предлагать первым лучшие решения, не\u003cspan class=\"nbsp\">&nbsp;\u003c/span>ожидая прямого запроса от\u003cspan class=\"nbsp\">&nbsp;\u003c/span>бизнеса.\u003c/li>\n\u003c/ul>20:T72f,\u003cul>\n\t\u003cli>Есть опыт работы продуктовым аналитиком от\u003cspan class=\"nbsp\">&nbsp;\u003c/span>пяти лет.\u003c/li>\n\t\u003cli>Знаешь методы исследования поведения клиентов, пользовательских сценариев и\u003cspan class=\"nbsp\">&nbsp;\u003c/span>взаимодействия с\u003cspan class=\"nbsp\">&nbsp;\u003c/span>продуктом.\u003c/li>\n\t\u003cli>Разбираешься в\u003cspan class=\"nbsp\">&nbsp;\u003c/span>Power BI или аналогичных инструментах, таких как\u003cspan class=\"nbsp\">&nbsp;\u003c/span>Tableau или QlikView, умеешь строить систему визуализации данных для\u003cspan class=\"nbsp\">&nbsp;\u003c/span>команды, чтобы\u003cspan class=\"nbsp\">&nbsp;\u003c/span>типовые вопросы закрывались без\u003cspan class=\"nbsp\">&nbsp;\u003c/span>ручных выгрузок.&nbsp;\u003c/li>\n\t\u003cli>Знаешь SQL, умеешь работать с\u003cspan class=\"nbsp\">&nbsp;\u003c/span>большими объёмами данных и\u003cspan class=\"nbsp\">&nbsp;\u003c/span>разбираешься в\u003cspan class=\"nbsp\">&nbsp;\u003c/span>математической статистике.\u003c/li>\n\t\u003cli>Есть опыт построения финансовой модели, юнит-экономики, дерева метрик.&nbsp;\u003c/li>\n\t\u003cli>Есть практика выстраивания аналитики в\u003cspan class=\"nbsp\">&nbsp;\u003c/span>продукте и\u003cspan class=\"nbsp\">&nbsp;\u003c/span>конкретные кейсы, где твоя аналитика помогла бизнесу.\u003c/li>\n\t\u003cli>Умеешь понятно доносить информацию даже до\u003cspan class=\"nbsp\">&nbsp;\u003c/span>тех, кто слабо разбирается в\u003cspan class=\"nbsp\">&nbsp;\u003c/span>данных.\u003c/li>\n\u003c/ul>21:Tf69,\u003cul>\n\t\u003cli>Официальная зарплата до\u003cspan class=\"nbsp\">&nbsp;\u003c/span>500 000 ₽. Точная сумма зависит от\u003cspan class=\"nbsp\">&nbsp;\u003c/span>твоих навыков и\u003cspan class=\"nbsp\">&nbsp;\u003c/span>ожиданий\u003cspan class=\"nbsp\">&nbsp;\u003c/span>— обсудим их на\u003cspan class=\"nbsp\">&nbsp;\u003c/span>собеседовании. Это сумма до\u003cspan class=\"nbsp\">&nbsp;\u003c/span>вычета налогов. Помни, что\u003cspan class=\"nbsp\">&nbsp;\u003c/span>с\u003cspan class=\"nbsp\">&nbsp;\u003c/span>2025 года ставка НДФЛ меняется в\u003cspan class=\"nbsp\">&nbsp;\u003c/span>зависимости от\u003cspan class=\"nbsp\">&nbsp;\u003c/span>суммарного дохода за\u003cspan class=\"nbsp\">&nbsp;\u003c/span>год.&nbsp;\u003c/li>\n\t\u003cli>Пятидневная рабочая неделя с\u003cspan class=\"nbsp\">&nbsp;\u003c/span>гибким началом и\u003cspan class=\"nbsp\">&nbsp;\u003c/span>окончанием дня.\u003c/li>\n\t\u003cli>Удалёнка или любой офис в\u003cspan class=\"nbsp\">&nbsp;\u003c/span>городах присутствия. Наши офисы\u003cspan class=\"nbsp\">&nbsp;\u003c/span>— это продуманные пространства с\u003cspan class=\"nbsp\">&nbsp;\u003c/span>комфортными рабочими местами и\u003cspan class=\"nbsp\">&nbsp;\u003c/span>зонами отдыха. Ты можешь самостоятельно выбрать, где работать\u003cspan class=\"nbsp\">&nbsp;\u003c/span>— ходить в\u003cspan class=\"nbsp\">&nbsp;\u003c/span>офис необязательно.&nbsp;\u003c/li>\n\t\u003cli>Понятная система развития и\u003cspan class=\"nbsp\">&nbsp;\u003c/span>роста по\u003cspan class=\"nbsp\">&nbsp;\u003c/span>грейдам.\u003c/li>\n\t\u003cli>Возможность работать по-своему. Никто не\u003cspan class=\"nbsp\">&nbsp;\u003c/span>будет навязывать свои методы и\u003cspan class=\"nbsp\">&nbsp;\u003c/span>контролировать каждое действие.\u003c/li>\n\t\u003cli>Возможность влиять на\u003cspan class=\"nbsp\">&nbsp;\u003c/span>стек, процессы внутри команды и\u003cspan class=\"nbsp\">&nbsp;\u003c/span>в\u003cspan class=\"nbsp\">&nbsp;\u003c/span>работе с\u003cspan class=\"nbsp\">&nbsp;\u003c/span>другими. Если\u003cspan class=\"nbsp\">&nbsp;\u003c/span>предлагаешь идеи и\u003cspan class=\"nbsp\">&nbsp;\u003c/span>улучшения\u003cspan class=\"nbsp\">&nbsp;\u003c/span>— ты будешь услышан.\u003c/li>\n\t\u003cli>Бесплатное обучение: ты сможешь ездить на\u003cspan class=\"nbsp\">&nbsp;\u003c/span>IT-конференции, мероприятия и\u003cspan class=\"nbsp\">&nbsp;\u003c/span>хакатоны и\u003cspan class=\"nbsp\">&nbsp;\u003c/span>проходить курсы за\u003cspan class=\"nbsp\">&nbsp;\u003c/span>счёт компании. А\u003cspan class=\"nbsp\">&nbsp;\u003c/span>ещё пользоваться нашей библиотекой и\u003cspan class=\"nbsp\">&nbsp;\u003c/span>платформой с\u003cspan class=\"nbsp\">&nbsp;\u003c/span>онлайн-курсами.\u003c/li>\n\t\u003cli>Комфорт не только в работе, но и в жизни. После испытательного срока: ДМС со стоматологией и 4 дополнительных выходных в год.\u003c/li>\n\t\u003cli>Бонусы от\u003cspan class=\"nbsp\">&nbsp;\u003c/span>партнёров: Skillbox, Skyeng, Яндекс Практикум, Ясно и\u003cspan class=\"nbsp\">&nbsp;\u003c/span>других.\u003c/li>\n\t\u003cli>Онлайн-кабинет сотрудника, где ты можешь заказать справку, оформить отпуск или отгул, заказать технику или посмотреть выплаты.\u003c/li>\n\t\u003cli>Активная корпоративная жизнь: устраиваем кинопоказы, спортивные марафоны и\u003cspan class=\"nbsp\">&nbsp;\u003c/span>корпоративы, которые потом ещё долго вспоминают.\u003c/li>\n\u003c/ul>6:[\"$\",\"$L1a\",null,{\"children\":[[[\"$\",\"$L1b\",null,{\"position\":\"ab span class=\"nbsp\">&nbsp;\u003c/span>онлайн-курсами.\u003c/li>\n\t\u003cli>Комфорт не только в работе, но и в жизни. После испытательного срока: ДМС со стоматологией и 4 дополнительных выходных в год.\u003c/li>\n\t\u003cli>Бонусы от\u003cspan class=\"nbsp\">&nbsp;\u003c/span>партнёров: Skillbox, Skyeng, Яндекс Практикум, Ясно и\u003cspan class=\"nbsp\">&nbsp;\u003c/span>других.\u003c/li>\n\t\u003cli>Онлайн-кабинет сотрудника, где ты можешь заказать справку, оформить отпуск или отгул, заказать технику или посмотреть выплаты.\u003c/li>\n\t\u003cli>Активная корпоративная жизнь: устраиваем кинопоказы, спортивные марафоны и\u003cspan class=\"nbsp\">&nbsp;\u003c/span>корпоративы, которые потом ещё долго вспоминают.\u003c/li>\n\u003c/ul>19:\"$14:metadata\"\n"])</script></body></html>
