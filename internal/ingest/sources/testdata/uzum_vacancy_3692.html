<!DOCTYPE html><html><head><title>Менеджер по работе с логистическими партнерами
 | Uzum People</title></head><body><script>self.__next_f.push([1,"\n1d:Tc2e,{\"components\":[{\"id\":1790597863825,\"type\":\"text\",\"displayType\":\"text\",\"value\":{\"body\":\"\u003cp>Ищем Менеджера по работе с логистическими партнерами, который будет отвечать за развитие партнерской сети, сопровождение логистических партнеров и рост активной базы курьеров.\u003c/p>\u003ch4>Чем предстоит заниматься:\u003c/h4>\u003cul style=\\\"list-style-type: circle;\\\">\u003cli>\u003cp>Искать и запускать новых логистических партнеров;\u003c/p>\u003c/li>\u003cli>\u003cp>Развивать и увеличивать активную базу курьеров у текущих партнеров;\u003c/p>\u003c/li>\u003cli>\u003cp>Пересматривать условия сотрудничества и находить точки роста;\u003c/p>\u003c/li>\u003cli>\u003cp>Разрабатывать и внедрять бонусные программы для партнеров;\u003c/p>\u003c/li>\u003cli>\u003cp>Проводить переговоры и выстраивать долгосрочные B2B-отношения;\u003c/p>\u003c/li>\u003cli>\u003cp>Анализировать эффективность партнеров, финансовые показатели и KPI;\u003c/p>\u003c/li>\u003cli>\u003cp>Оптимизировать и автоматизировать процессы взаимодействия с партнерами;\u003c/p>\u003c/li>\u003cli>\u003cp>Участвовать во внедрении CRM и развитии партнерской программы;\u003c/p>\u003c/li>\u003cli>\u003cp>Взаимодействовать с командами финансов, бухгалтерии и юристами.\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003ch4>Что для нас важно:\u003c/h4>\u003cul style=\\\"list-style-type: circle;\\\">\u003cli>\u003cp>Опыт работы в B2B, партнерском направлении, логистике, e-commerce или смежных сферах;\u003c/p>\u003c/li>\u003cli>\u003cp>Обязателен опыт работы с внешними партнерами и ведения переговоров;\u003c/p>\u003c/li>\u003cli>\u003cp>Опыт работы с KPI и финансовой аналитикой;\u003c/p>\u003c/li>\u003cli>\u003cp>Понимание CRM, воронок продаж/найма и автоматизации процессов;\u003c/p>\u003c/li>\u003cli>\u003cp>Аналитическое и продуктовое мышление;\u003c/p>\u003c/li>\u003cli>\u003cp>Проактивность, системность и умение вести несколько задач одновременно.\u003c/p>\u003c/li>\u003c/ul>\u003cp>\u003cbr>\u003c/p>\u003ch4>Что мы предлагаем:\u003c/h4>\u003cul style=\\\"list-style-type: circle;\\\">\u003cli>\u003cp>Конкурентная зарплата — платим на уровне топовых компаний;\u003c/p>\u003c/li>\u003cli>\u003cp>Карьерное развитие — даём действительно неограниченные возможности для роста;\u003c/p>\u003c/li>\u003cli>\u003cp>Дисконт-программы от компаний-партнёров;\u003c/p>\u003c/li>\u003cli>\u003cp>Отсутствие дресс-кода и бюрократии.\u003c/p>\u003c/li>\u003c/ul>\"}}]}"])</script><script>self.__next_f.push([1,"\n1e:Td1b,{\"components\":[{\"id\":1791293722777,\"type\":\"text\",\"displayType\":\"text\",\"value\":{\"body\":\"\u003cp>\u003cp dir=\\\"ltr\\\">Logistika hamkorlari bilan ishlash bo‘yicha menejerni qidirmoqdamiz. U hamkorlik tarmog‘ini rivojlantirish, logistika hamkorlarini qo‘llab-quvvatlash va faol kuryerlar bazasini kengaytirish uchun mas’ul bo‘ladi.\u003c/p>\u003ch4 dir=\\\"ltr\\\">Nima bilan shug‘ullanasiz:\u003c/h4>\u003cul>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Yangi logistika hamkorlarini izlash va ishga tushirish;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Amaldagi hamkorlarda faol kuryerlar bazasini rivojlantirish va kengaytirish;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Hamkorlik shartlarini qayta ko‘rib chiqish va o‘sish nuqtalarini aniqlash;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Hamkorlar uchun bonus dasturlarini ishlab chiqish va joriy etish;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Muzokaralar olib borish va uzoq muddatli B2B-munosabatlarni yo‘lga qo‘yish;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Hamkorlar samaradorligi, moliyaviy ko‘rsatkichlar va KPIlarni tahlil qilish;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Hamkorlar bilan o‘zaro hamkorlik jarayonlarini optimallashtirish va avtomatlashtirish;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">CRM tizimini joriy etish va hamkorlik dasturini rivojlantirishda ishtirok etish;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Moliya, buxgalteriya va yuridik jamoalar bilan hamkorlik qilish.\u003c/p>\u003c/li>\u003c/ul>\u003ch4 dir=\\\"ltr\\\">Biz uchun nimalar muhim:\u003c/h4>\u003cul>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">B2B, hamkorlik yo‘nalishi, logistika, e-commerce yoki turdosh sohalarda ish tajribasi;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Tashqi hamkorlar bilan ishlash va muzokaralar olib borish tajribasi majburiy;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">KPI va moliyaviy analitika bilan ishlash tajribasi;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">CRM, savdo/ishga qabul qilish voronkalari va jarayonlarni avtomatlashtirishni tushunish;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Analitik va mahsulotga yo‘naltirilgan fikrlash;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Proaktivlik, tizimlilik va bir vaqtning o‘zida bir nechta vazifalarni olib borish qobiliyati.\u003c/p>\u003c/li>\u003c/ul>\u003ch4 dir=\\\"ltr\\\">Nima taklif qilamiz:\u003c/h4>\u003cul>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Raqobatbardosh maosh — top kompaniyalar darajasida to‘laymiz;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Karyera rivojlanishi — o‘sish uchun haqiqatan ham cheksiz imkoniyatlar taqdim etamiz;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Hamkor kompaniyalardan chegirma dasturlari;\u003c/p>\u003c/li>\u003cli dir=\\\"ltr\\\" aria-level=\\\"1\\\">\u003cp dir=\\\"ltr\\\" role=\\\"presentation\\\">Dress-kod va byurokratiyaning yo‘qligi.\u003c/p>\u003c/li>\u003c/ul>\u003cbr>\u003c/p>\"}}]}"])</script><script>self.__next_f.push([1,"5:[\"$\",\"main\",null,{\"children\":[[\"$\",\"script\",null,{\"id\":\"schema-vacancy-breadcrumb-3692\",\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"Главная\\\",\\\"item\\\":\\\"https://people.uzum.com/career/ru\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"Вакансии\\\",\\\"item\\\":\\\"https://people.uzum.com/career/ru/vacancies\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":3,\\\"name\\\":\\\"Менеджер по работе с логистическими партнерами\\\\n\\\",\\\"item\\\":\\\"https://people.uzum.com/career/ru/vacancies/3692\\\"}]}\"}}],[\"$\",\"script\",null,{\"id\":\"schema-job-posting-3692\",\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$1b\"}}],[\"$\",\"$L1c\",null,{\"locale\":\"ru\",\"vacancy\":{\"id\":3692,\"linked_id\":3691,\"type\":\"Original\",\"status\":\"Published\",\"title_ru\":\"Менеджер по работе с логистическими партнерами\\n\",\"title_en\":\"Logistika hamkorlari bilan ishlash bo‘yicha menejer\\n\",\"body_ru\":\"$1d\",\"body_en\":\"$1e\",\"disabled\":false,\"t
